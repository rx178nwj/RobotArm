<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi I2C Bridge Monitor</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <aside><div class="brand"><span class="logo">M6</span><div><b>Bridge Monitor</b><small>AS5600 · 6 channel</small></div></div>
    <section><div class="section-title">DETECTED DEVICES <button id="refresh">↻</button></div><div id="ports"></div>
      <div class="manual"><input id="manual-port" placeholder="COM34 / /dev/ttyACM0"><button id="manual-connect">Connect</button></div>
      <div id="connection-message" class="connection-message" aria-live="polite"></div></section>
    <section><div class="section-title">CONNECTED</div><div id="devices"><div class="empty-small">No active devices</div></div></section>
  </aside>
  <main>
    <header><div><h1>Encoder telemetry</h1><p id="subtitle">Select or connect a bridge to begin</p></div>
      <div class="global-controls"><label>Period <input id="period" type="number" min="100" max="60000" value="1000"> ms</label><button id="start-all" class="primary">Start all</button><button id="stop-all">Stop all</button><button id="layout">Grid</button></div></header>
    <div id="content"><div class="welcome"><div class="radar"></div><h2>Waiting for a bridge</h2><p>RP2040 USB devices appear in the sidebar. Connection remains explicit so other serial tools are not interrupted.</p></div></div>
  </main>
  <script src="renderer.js"></script>
</body></html>
