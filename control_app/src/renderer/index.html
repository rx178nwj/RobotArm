<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Arm Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">ROBOTARM2 / CONTROL SERVICE</p>
      <h1>Control App</h1>
    </div>
    <div id="ipc-status" class="status disconnected"><span></span> IPC 未接続</div>
  </header>
  <main>
    <section>
      <div class="section-title">
        <h2>SteppingMotorDriver</h2>
        <span id="board-count">0 boards</span>
      </div>
      <div id="boards" class="boards"><p class="empty">接続中の基板はありません</p></div>
    </section>
    <section class="log-section">
      <div class="section-title"><h2>Activity</h2><span>直近 200 件</span></div>
      <div id="logs" class="logs"><p class="empty">ログはありません</p></div>
    </section>
  </main>
  <footer>状態表示専用 — モーション操作UIは Phase 1 の対象外です</footer>
  <script src="renderer.js"></script>
</body>
</html>
